[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ariadne-fund-ops"
version = "0.1.1"
description = "Evidence-backed local fund operations web workbench"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ariadne = "ariadne.__main__:main"

[tool.setuptools.packages.find]
include = ["ariadne*"]

[tool.setuptools.package-data]
ariadne = ["web/*.html", "web/*.css", "web/*.js"]
