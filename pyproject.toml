[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ariadne-fund-ops"
version = "0.2.2"
description = "Evidence-backed local fund operations web workbench"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
outlook = ["msal==1.39.0", "msal-extensions==1.3.1"]

[project.scripts]
ariadne = "ariadne.__main__:main"

[tool.setuptools.packages.find]
include = ["ariadne*"]

[tool.setuptools.package-data]
ariadne = ["web/*.html", "web/*.css", "web/*.js", "outlook/*.ps1"]
